name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build a release for (e.g. v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release assets
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      # Required to create the release and attach assets.
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The full validation suite gates the release: a tag must not ship
      # anything CI would have rejected on main.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: JSON Schemas match the Zod contracts
        run: pnpm run schemas:check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Build the example with MyST
        run: pnpm run example:build

      - name: Check the tag matches the package version
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v${package_version}" ]; then
            echo "Tag ${TAG} does not match package.json version ${package_version}." >&2
            exit 1
          fi
          echo "Tag ${TAG} matches package.json version ${package_version}."

      - name: Stage release assets
        run: |
          set -euo pipefail
          mkdir -p release
          cp dist/oratlas-myst.mjs release/
          cp SPEC.md release/
          cp schemas/oratlas-manifest.schema.json release/
          cp schemas/oratlas-claim.schema.json release/
          (cd release && sha256sum -- * > SHA256SUMS.txt)
          ls -la release

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: release
          retention-days: 30

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          generate_release_notes: true
          files: |
            release/oratlas-myst.mjs
            release/SPEC.md
            release/oratlas-manifest.schema.json
            release/oratlas-claim.schema.json
            release/SHA256SUMS.txt
          body: |
            ## Using the plugin from this release

            Pin the exact tag in `myst.yml` — never a `latest` URL, which would
            change under a publication between builds:

            ```yaml
            project:
              plugins:
                - https://github.com/dhuzard/oratlas-myst/releases/download/${{ inputs.tag || github.ref_name }}/oratlas-myst.mjs
            ```

            The `oratlas-myst` CLI still comes from the npm package.

            `SHA256SUMS.txt` covers every asset attached here.

# Note: npm publishing is deliberately not configured. Adding it requires an
# NPM_TOKEN secret and an explicit decision to publish from CI; until then the
# package is published manually with `npm publish --access public`.

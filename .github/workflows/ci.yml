name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: JSON Schemas match the Zod contracts
        run: pnpm run schemas:check

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm run test

      - name: Export the example
        # `--source-commit` is how a git-backed publication names the commit it
        # was built from; the config file naming it is part of that commit.
        run: node dist/lib/cli/main.js export --project examples/basic --source-commit "$GITHUB_SHA"
        env:
          GITHUB_SHA: ${{ github.sha }}

      - name: Validate the example
        run: node dist/lib/cli/main.js validate --project examples/basic

      - name: Build the example with MyST
        run: pnpm run example:build

      - name: Upload the built example
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: example-build
          path: examples/basic/_build/html
          retention-days: 7
          if-no-files-found: warn

  acceptance:
    name: Acceptance — fresh external consumer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # The frozen v0.2 acceptance criterion: a fresh external MyST project
      # installs @oratlas/myst from the packed tarball, exports through the
      # installed bin, builds with the real book-theme, serves the three
      # artifacts at its site root, and validates. This is the only check that
      # exercises the published `files` list, the `bin` entry, and the plugin
      # being resolved from node_modules.
      - name: Acceptance criterion
        run: pnpm run acceptance

  node-versions:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run test
